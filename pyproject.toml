[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inventory-optimizer"
dynamic = ["version"]
description = "Turn sales history and stock levels into ABC/XYZ classes, safety stock, reorder points, EOQ and supplier purchase orders in one command."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kevin Vasilescu" }]
keywords = ["inventory", "supply-chain", "eoq", "abc-analysis", "reorder-point", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["pandas>=2.0", "typer>=0.9", "jinja2>=3.1"]

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "pandas-stubs",
    "pre-commit",
    "build",
    "twine",
    "openpyxl>=3.1",
]

[project.scripts]
invopt = "inventory_optimizer.cli:app"

[project.urls]
Homepage = "https://github.com/kevin-vasilescu/inventory-optimizer"
Issues = "https://github.com/kevin-vasilescu/inventory-optimizer/issues"

[tool.hatch.version]
path = "src/inventory_optimizer/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/inventory_optimizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
strict = true
files = ["src"]
